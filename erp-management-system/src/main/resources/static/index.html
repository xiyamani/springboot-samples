<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#127565">
  <title>ERP 管理系统 · 企业业务工作台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/training.css">
  <script src="/vendor/vue.global.prod.js" defer></script>
  <script src="/vendor/lucide.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
<div id="app" v-cloak>
  <div v-if="!authChecked" class="initial-loading"><span class="brand-symbol"><app-icon name="blocks"></app-icon></span><h2>ERP 管理系统</h2><app-icon name="loader-circle" class="spinning"></app-icon></div>
  <div v-else-if="!user" class="login-page">
    <a class="brand" href="#overview"><span class="brand-symbol"><app-icon name="blocks"></app-icon></span><span><b>ERP 管理系统</b></span></a>
    <div class="login-content"><div class="eyebrow">MANUFACTURING OPERATIONS</div><h1>登录业务工作台</h1><p class="login-subtitle">采购 · 销售 · 库存 · 生产协同</p>
      <form @submit.prevent="login"><label>账号<input v-model="loginForm.username" autocomplete="username" required maxlength="60"></label><label>密码<input type="password" v-model="loginForm.password" autocomplete="current-password" required></label><p v-if="loginError" class="form-error" role="alert">{{loginError}}</p><button type="submit" class="btn primary full-width" :disabled="saving"><app-icon :name="saving?'loader-circle':'log-in'" :class="{spinning:saving}"></app-icon>{{saving?'正在登录':'登录'}}</button></form>
      <div class="training-accounts"><span>角色账号</span><div><button v-for="a in accounts" @click="chooseAccount(a)" :class="{selected:loginForm.username===a.username}" :title="a.username+' / '+a.password"><app-icon :name="a.role==='ADMIN'?'shield-check':a.role==='REVIEWER'?'clipboard-check':a.role==='WAREHOUSE'?'warehouse':'user-round'"></app-icon>{{a.label}}</button></div><small>当前：{{loginForm.username}} · 初始密码 {{accounts.find(a=>a.username===loginForm.username)?.password||'由管理员分配'}}</small></div>
    </div><footer>ERP 管理系统 · 制造业务账套</footer>
  </div>
  <template v-else>
  <div class="mobile-shade" v-if="mobileNav" @click="mobileNav=false"></div>
  <aside class="sidebar" :class="{open:mobileNav}">
    <a class="brand" href="#overview"><span class="brand-symbol"><app-icon name="blocks"></app-icon></span><span><b>ERP 管理系统</b></span></a>
    <div class="workspace-label"><span class="workspace-avatar"><app-icon name="building-2"></app-icon></span><div>制造业务账套<small>主仓 · CNY 人民币</small></div><span class="live-dot"></span></div>
    <div class="nav-caption">业务空间</div>
    <nav aria-label="主导航">
      <a v-for="item in visibleNavigation" :href="'#'+item.id" :class="{active:page===item.id}" @click="mobileNav=false">
        <app-icon :name="item.icon"></app-icon><span>{{item.label}}</span><span class="nav-count" v-if="item.id==='purchase' && pendingPurchases">{{pendingPurchases}}</span><span class="nav-count" v-if="item.id==='sales' && pendingSales">{{pendingSales}}</span><span class="nav-count" v-if="item.id==='approvals'&&pendingApprovals">{{pendingApprovals}}</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <div class="environment"><span class="live-dot"></span>本地运行<span class="version">v2.0</span></div>
      <div class="local-account"><span class="account-avatar"><app-icon name="user-round"></app-icon></span><div>{{currentAccount.label}}<small>{{user.username}}</small></div><button class="icon-button" title="退出并切换账号" @click="logout"><app-icon name="log-out"></app-icon></button></div>
    </div>
  </aside>
  <div class="main-shell">
    <header class="topbar">
      <div class="breadcrumb"><button class="icon-button mobile-menu" title="展开导航" @click="mobileNav=true"><app-icon name="menu"></app-icon></button><app-icon name="layout-grid"></app-icon><span>业务空间</span><span class="slash">/</span><strong>{{currentTitle}}</strong></div>
      <div class="topbar-right"><span class="demo-badge"><span class="live-dot"></span>主仓账套</span><span class="top-date">{{dateLabel}}</span><button class="icon-button" title="刷新业务数据" aria-label="刷新业务数据" @click="refresh()" :disabled="loading"><app-icon name="refresh-cw" :class="{spinning:loading}"></app-icon></button></div>
    </header>
    <main>
      <div v-if="fatal" class="load-error"><app-icon name="wifi-off"></app-icon><h2>暂时无法连接业务服务</h2><p>{{fatal}}</p><button class="btn primary" @click="refresh()">重新连接</button></div>
      <template v-else>
      <div class="page-heading">
        <div><div class="eyebrow">{{page==='overview'?'OPERATIONS OVERVIEW':page==='reports'?'BUSINESS INTELLIGENCE':'BUSINESS OPERATIONS'}}</div><h1>{{currentTitle}}</h1><p>{{pageDescription}}</p></div>
        <div class="heading-actions">
          <template v-if="page==='overview'&&can('edit')"><button class="btn" @click="openOrder('PURCHASE')"><app-icon name="plus"></app-icon>新建采购</button><button class="btn primary" @click="openOrder('SALE')"><app-icon name="plus"></app-icon>新建销售</button></template>
          <button v-if="(page==='purchase'||page==='sales')&&can('edit')" class="btn primary" @click="openOrder(orderType)"><app-icon name="plus"></app-icon>{{page==='purchase'?'新建采购单':'新建销售单'}}</button>
          <button v-if="page==='inventory'" class="btn" @click="download(inventoryTab==='stock'?'inventory':'movements')"><app-icon name="download"></app-icon>导出{{inventoryTab==='stock'?'库存':'流水'}}</button>
          <button v-if="page==='master'&&can('edit')" class="btn primary" @click="masterTab==='products'?openProduct():openPartner()"><app-icon name="plus"></app-icon>{{masterTab==='products'?'新增商品':'新增往来单位'}}</button>
          <button v-if="page==='reports'" class="btn" @click="exportReport"><app-icon name="download"></app-icon>导出当前报表</button>
          <button v-if="page==='integrations'" class="btn" @click="loadConnections" :disabled="connectionLoading"><app-icon name="refresh-cw" :class="{spinning:connectionLoading}"></app-icon>刷新协同状态</button>
        </div>
      </div>

      <template v-if="page==='overview'">
        <section class="role-banner surface"><div class="role-banner-icon"><app-icon :name="roleCode==='ADMIN'?'shield-check':roleCode==='REVIEWER'?'clipboard-check':roleCode==='WAREHOUSE'?'warehouse':'briefcase-business'"></app-icon></div><div class="role-banner-copy"><div class="eyebrow">CURRENT WORKSPACE</div><h2>{{roleLabel}}工作台</h2><p>{{roleSummary}}</p></div><div class="role-banner-actions"><a v-if="roleCode==='OPERATOR'" class="btn primary" href="#purchase"><app-icon name="plus"></app-icon>新建采购单</a><a v-if="roleCode==='REVIEWER'" class="btn primary" href="#approvals"><app-icon name="clipboard-check"></app-icon>进入审批中心</a><a v-if="roleCode==='WAREHOUSE'" class="btn primary" href="#inventory"><app-icon name="boxes"></app-icon>查看库存执行</a><a v-if="roleCode==='ADMIN'" class="btn primary" href="#integrations"><app-icon name="network"></app-icon>查看系统协同</a></div></section>
        <section class="stats-grid">
          <article class="stat-card"><div class="stat-label">本月销售额<span class="stat-icon teal"><app-icon name="trending-up"></app-icon></span></div><strong>¥{{money(monthSales)}}</strong><div class="stat-foot"><span class="green">{{completedMonthSales.length}} 笔</span> 已出库销售单</div></article>
          <article class="stat-card"><div class="stat-label">本月采购额<span class="stat-icon blue"><app-icon name="shopping-cart"></app-icon></span></div><strong>¥{{money(monthPurchases)}}</strong><div class="stat-foot">{{completedMonthPurchases.length}} 笔已入库采购单</div></article>
          <article class="stat-card"><div class="stat-label">库存资产<span class="stat-icon violet"><app-icon name="boxes"></app-icon></span></div><strong>¥{{money(stockValue)}}</strong><div class="stat-foot">{{data.products.length}} 种商品 <span class="dot-separator">·</span> 移动加权成本</div></article>
          <article class="stat-card"><div class="stat-label">待处理单据<span class="stat-icon amber"><app-icon name="clipboard-list"></app-icon></span></div><strong>{{pendingPurchases+pendingSales}}<small>笔</small></strong><div class="stat-foot"><a href="#purchase">{{pendingPurchases}} 笔待入库</a><span class="dot-separator">·</span><a href="#sales">{{pendingSales}} 笔待出库</a></div></article>
        </section>
        <div class="overview-primary">
          <section class="surface trend-panel"><div class="section-heading"><div><h2>采购与销售趋势</h2><p>近 14 天 · 已完成单据金额</p></div><span class="chart-unit">单位：元</span></div>
            <div class="chart-legend"><span><b class="legend-swatch sales-swatch"></b>销售金额</span><span><b class="legend-swatch purchase-swatch"></b>采购金额</span></div>
            <div class="bar-chart"><div class="chart-axis"><span>{{compact(chartMax)}}</span><span>{{compact(chartMax/2)}}</span><span>0</span></div><div class="chart-plot"><div class="chart-grid line-top"></div><div class="chart-grid line-mid"></div><div class="chart-grid line-bottom"></div><div class="day-group" v-for="(day,index) in trend" :key="day.date" tabindex="0" :aria-label="day.date+' 销售 '+money(day.sales)+' 采购 '+money(day.purchase)"><div class="bar-pair"><div class="chart-bar sale-bar" :style="{height:(day.sales/chartMax*100)+'%'}"></div><div class="chart-bar purchase-bar" :style="{height:(day.purchase/chartMax*100)+'%'}"></div></div><span class="day-label">{{index%2===0||index===13?day.date.slice(5).replace('-','/'):''}}</span><div class="chart-tooltip"><strong>{{day.date}}</strong><span>销售 ¥{{money(day.sales)}}</span><span>采购 ¥{{money(day.purchase)}}</span></div></div></div></div>
          </section>
          <section class="surface alert-panel"><div class="section-heading"><div><h2><app-icon name="triangle-alert" class="amber-text"></app-icon>库存预警 <span class="count-pill">{{lowStock.length}}</span></h2><p>当前库存低于预警下限</p></div><a class="text-link" href="#inventory" @click="stockFilter='low'">查看全部<app-icon name="arrow-up-right"></app-icon></a></div>
            <div v-if="!lowStock.length" class="empty compact-empty"><app-icon name="circle-check"></app-icon><p>所有商品库存充足</p></div>
            <div class="alert-list"><div class="alert-item" v-for="p in lowStock.slice(0,4)"><span class="product-symbol" :class="categoryColor(p.category)"><app-icon :name="categoryIcon(p.category)"></app-icon></span><div class="alert-product"><strong>{{p.name}}</strong><small>{{p.sku}} · 下限 {{qty(p.min_stock)}} {{p.unit}}</small><div class="stock-track"><span :style="{width:Math.min(100,p.stock/Math.max(1,p.min_stock)*100)+'%'}"></span></div></div><div class="alert-amount">{{qty(p.stock)}}<small>{{p.unit}}</small></div></div></div>
            <button class="btn full-width" @click="openOrder('PURCHASE',null,lowStock[0])" v-if="lowStock.length&&can('edit')"><app-icon name="plus"></app-icon>创建补货采购单</button>
          </section>
        </div>
        <section class="surface"><div class="section-heading"><div><h2>最近业务单据</h2><p>采购与销售的最新进展</p></div><a class="text-link" href="#sales">全部销售<app-icon name="arrow-up-right"></app-icon></a></div>
          <div class="table-scroll"><table><thead><tr><th>单据编号</th><th>业务类型</th><th>往来单位</th><th>业务日期</th><th class="numeric">金额</th><th>状态</th><th class="right">操作</th></tr></thead><tbody><tr v-for="o in data.orders.slice(0,6)" :key="o.id"><td><button class="table-link mono" @click="showDetail(o.id)">{{o.order_no}}</button></td><td><span class="type-mark" :class="o.type==='PURCHASE'?'purchase-mark':'sale-mark'"><app-icon :name="o.type==='PURCHASE'?'arrow-down-left':'arrow-up-right'"></app-icon>{{o.type==='PURCHASE'?'采购':'销售'}}</span></td><td>{{o.partner_name}}</td><td class="muted">{{o.business_date}}</td><td class="numeric strong">¥{{money(o.total_amount)}}</td><td><span class="status-badge" :class="o.status.toLowerCase()"><b></b>{{orderStateLabel(o)}}</span></td><td class="right"><button class="text-link" @click="showDetail(o.id)">查看<app-icon name="chevron-right"></app-icon></button></td></tr><tr v-if="!data.orders.length"><td colspan="7" class="empty-cell">暂无业务单据</td></tr></tbody></table></div>
        </section>
      </template>

      <template v-if="page==='purchase'||page==='sales'">
        <div class="summary-strip"><div><span>本月已{{page==='purchase'?'入库':'出库'}}</span><strong>¥{{money(page==='purchase'?monthPurchases:monthSales)}}</strong></div><div><span>待{{page==='purchase'?'入库':'出库'}}</span><strong>{{page==='purchase'?pendingPurchases:pendingSales}}<small>笔</small></strong></div><div><span>全部单据</span><strong>{{typeOrders.length}}<small>笔</small></strong></div><app-icon :name="page==='purchase'?'package-plus':'truck'" class="strip-icon"></app-icon></div>
        <section class="surface"><div class="list-toolbar"><div class="tabs"><button v-for="s in statuses" :class="{active:statusFilter===s.id}" @click="statusFilter=s.id;tablePage=1">{{s.label}}<span>{{s.id==='ALL'?typeOrders.length:typeOrders.filter(o=>o.status===s.id).length}}</span></button></div><div class="toolbar-controls"><label class="search-field"><app-icon name="search"></app-icon><input v-model="search" placeholder="搜索单号、单位或备注" aria-label="搜索单据"></label><button class="icon-button bordered" title="导出全部采购与销售单据" @click="download('orders')"><app-icon name="download"></app-icon></button></div></div>
          <div class="table-scroll"><table><thead><tr><th><button @click="sortBy('order_no')">单据编号<app-icon name="arrow-up-down"></app-icon></button></th><th>{{page==='purchase'?'供应商':'客户'}}</th><th><button @click="sortBy('business_date')">业务日期<app-icon name="arrow-up-down"></app-icon></button></th><th class="numeric">商品种类</th><th class="numeric"><button @click="sortBy('total_amount')">单据金额<app-icon name="arrow-up-down"></app-icon></button></th><th>状态</th><th class="right">操作</th></tr></thead><tbody><tr v-for="o in pagedRows" :key="o.id"><td><button class="table-link mono" @click="showDetail(o.id)">{{o.order_no}}</button></td><td>{{o.partner_name}}</td><td class="muted">{{o.business_date}}</td><td class="numeric">{{o.line_count}}</td><td class="numeric strong">¥{{money(o.total_amount)}}</td><td><span class="status-badge" :class="o.status.toLowerCase()"><b></b>{{orderStateLabel(o)}}</span></td><td class="right"><div class="row-actions"><button class="text-link" @click="showDetail(o.id)">详情</button><button class="text-link green" v-if="o.status==='DRAFT'&&o.workflow_state==='APPROVED'&&can('post')" @click="confirmPost(o)">{{page==='purchase'?'入库':'出库'}}<app-icon name="arrow-right"></app-icon></button></div></td></tr><tr v-if="!filteredRows.length"><td colspan="7" class="empty-cell"><app-icon name="inbox"></app-icon><p>没有符合条件的单据</p><button class="text-link" @click="search='';statusFilter='ALL'">清除筛选</button></td></tr></tbody></table></div>
          <div class="pagination"><span>共 {{filteredRows.length}} 笔单据</span><div><button class="icon-button" title="上一页" :disabled="tablePage===1" @click="tablePage--"><app-icon name="chevron-left"></app-icon></button><span>{{tablePage}} / {{pageCount}}</span><button class="icon-button" title="下一页" :disabled="tablePage>=pageCount" @click="tablePage++"><app-icon name="chevron-right"></app-icon></button></div></div>
        </section>
      </template>

      <template v-if="page==='inventory'">
        <div class="summary-strip"><div><span>库存资产</span><strong>¥{{money(stockValue)}}</strong></div><div><span>库存商品</span><strong>{{data.products.length}}<small>种</small></strong></div><div><span>低库存商品</span><strong class="amber-text">{{lowStock.length}}<small>种</small></strong></div><span class="warehouse-label"><app-icon name="warehouse"></app-icon>主仓</span></div>
        <section class="surface"><div class="list-toolbar"><div class="tabs"><button :class="{active:inventoryTab==='stock'}" @click="inventoryTab='stock';tablePage=1">实时库存</button><button :class="{active:inventoryTab==='movements'}" @click="inventoryTab='movements';tablePage=1">出入库流水</button></div><div class="toolbar-controls"><label class="search-field"><app-icon name="search"></app-icon><input v-model="search" placeholder="搜索商品名称或编码" aria-label="搜索库存"></label><select v-model="stockFilter" v-if="inventoryTab==='stock'" aria-label="库存状态"><option value="all">全部库存</option><option value="low">低库存预警</option><option value="zero">零库存</option></select><select v-model="movementFilter" v-else aria-label="流水类型"><option value="ALL">全部类型</option><option value="PURCHASE">采购入库</option><option value="SALE">销售出库</option><option value="OPENING">期初库存</option></select></div></div>
          <div class="table-scroll" v-if="inventoryTab==='stock'"><table><thead><tr><th>商品编码</th><th>商品名称</th><th>分类</th><th class="numeric"><button @click="sortBy('stock')">可用库存<app-icon name="arrow-up-down"></app-icon></button></th><th class="numeric">预警下限</th><th class="numeric">平均成本</th><th class="numeric">库存金额</th><th>库存状态</th></tr></thead><tbody><tr v-for="p in pagedRows"><td class="mono muted">{{p.sku}}</td><td class="strong">{{p.name}}</td><td><span class="category-tag">{{p.category}}</span></td><td class="numeric strong" :class="p.stock<p.min_stock?'amber-text':''">{{qty(p.stock)}} <small class="muted">{{p.unit}}</small></td><td class="numeric muted">{{qty(p.min_stock)}}</td><td class="numeric">¥{{money(p.average_cost)}}</td><td class="numeric">¥{{money(p.stock*p.average_cost)}}</td><td><span class="status-badge" :class="p.stock<p.min_stock?'draft':'completed'"><b></b>{{p.stock<p.min_stock?'库存偏低':'库存正常'}}</span></td></tr><tr v-if="!filteredRows.length"><td colspan="8" class="empty-cell">没有符合条件的商品</td></tr></tbody></table></div>
          <div class="table-scroll" v-else><table><thead><tr><th>商品</th><th>业务类型</th><th>来源单据</th><th class="numeric">变动数量</th><th class="numeric">结存数量</th><th class="numeric">单位成本</th><th>业务日期</th></tr></thead><tbody><tr v-for="m in pagedRows"><td><strong>{{m.product_name}}</strong><small class="cell-sub mono">{{m.sku}}</small></td><td>{{movementLabel(m.type)}}</td><td><button v-if="m.order_id" class="table-link mono" @click="showDetail(m.order_id)">{{m.order_no}}</button><span v-else class="muted">期初建账</span></td><td class="numeric strong" :class="m.quantity>0?'green':'red'">{{m.quantity>0?'+':''}}{{qty(m.quantity)}} {{m.unit}}</td><td class="numeric">{{qty(m.balance)}}</td><td class="numeric">¥{{money(m.unit_cost)}}</td><td class="muted">{{m.business_date}}</td></tr><tr v-if="!filteredRows.length"><td colspan="7" class="empty-cell">暂无匹配的库存流水</td></tr></tbody></table></div>
          <div class="pagination"><span>共 {{filteredRows.length}} 条记录</span><div><button class="icon-button" title="上一页" :disabled="tablePage===1" @click="tablePage--"><app-icon name="chevron-left"></app-icon></button><span>{{tablePage}} / {{pageCount}}</span><button class="icon-button" title="下一页" :disabled="tablePage>=pageCount" @click="tablePage++"><app-icon name="chevron-right"></app-icon></button></div></div>
        </section>
      </template>

      <template v-if="page==='reports'">
        <div class="report-filters"><div class="segmented"><button v-for="r in [{id:'month',label:'本月'},{id:'7',label:'近 7 天'},{id:'30',label:'近 30 天'},{id:'custom',label:'自定义'}]" :class="{active:reportRange===r.id}" @click="setReportRange(r.id)">{{r.label}}</button></div><div class="date-range"><input type="date" v-model="reportStart" :max="reportEnd" aria-label="报表开始日期" @change="reportRange='custom'"><span>至</span><input type="date" v-model="reportEnd" :min="reportStart" :max="data.today" aria-label="报表结束日期" @change="reportRange='custom'"></div></div>
        <section class="stats-grid"><article class="stat-card"><div class="stat-label">销售收入<app-icon name="banknote"></app-icon></div><strong>¥{{money(reportSales)}}</strong><div class="stat-foot">已完成销售单据</div></article><article class="stat-card"><div class="stat-label">销售成本<app-icon name="calculator"></app-icon></div><strong>¥{{money(reportCost)}}</strong><div class="stat-foot">出库时移动加权成本</div></article><article class="stat-card"><div class="stat-label">销售毛利<app-icon name="chart-no-axes-combined"></app-icon></div><strong :class="reportSales-reportCost<0?'red':'green'">¥{{money(reportSales-reportCost)}}</strong><div class="stat-foot">销售收入 − 销售成本</div></article><article class="stat-card"><div class="stat-label">销售毛利率<app-icon name="percent"></app-icon></div><strong>{{reportSales?((reportSales-reportCost)/reportSales*100).toFixed(1):'0.0'}}<small>%</small></strong><div class="stat-foot">未包含税费与其他费用</div></article></section>
        <div class="report-grid"><section class="surface"><div class="section-heading"><div><h2>分类销售构成</h2><p>{{reportStart}} 至 {{reportEnd}}</p></div></div><div class="category-chart"><div v-for="(c,i) in categoryReport" class="category-chart-row"><span class="category-dot" :style="{background:chartColors[i%chartColors.length]}"></span><div><div class="category-chart-label"><strong>{{c.name}}</strong><span>¥{{money(c.amount)}} <small>{{reportSales?(c.amount/reportSales*100).toFixed(1):0}}%</small></span></div><div class="category-track"><span :style="{width:(reportSales?c.amount/reportSales*100:0)+'%',background:chartColors[i%chartColors.length]}"></span></div></div></div><div v-if="!categoryReport.length" class="empty compact-empty"><app-icon name="chart-column"></app-icon><p>所选期间暂无已出库销售</p></div></div></section>
        <section class="surface"><div class="section-heading"><div><h2>往来单位销售排名</h2><p>按已完成销售金额排序</p></div></div><div class="customer-ranking"><div v-for="(c,i) in customerReport"><span class="rank">{{String(i+1).padStart(2,'0')}}</span><strong>{{c.name}}</strong><span>¥{{money(c.amount)}}</span></div><div v-if="!customerReport.length" class="empty compact-empty"><app-icon name="users"></app-icon><p>暂无客户销售数据</p></div></div></section></div>

          <div class="form-subheading"><h3>商品明细</h3><button type="button" class="text-link" @click="addLine"><app-icon name="plus"></app-icon>添加商品</button></div>

            <span class="phase" :class="{active:detail.workflow&&detail.workflow.state!=='DRAFT'}"><app-icon name="send"></app-icon>提交</span><app-icon name="chevron-right"></app-icon>
            <span class="phase" :class="{active:detail.workflow?.state==='APPROVED'||detail.status==='COMPLETED',rejected:detail.workflow?.state==='REJECTED'}"><app-icon name="clipboard-check"></app-icon>{{detail.workflow?.state==='REJECTED'?'已驳回':'审批'}}</span><app-icon name="chevron-right"></app-icon>
            <span class="phase" :class="{active:detail.status==='COMPLETED'}"><app-icon name="package-check"></app-icon>{{detail.type==='PURCHASE'?'入库':'出库'}}</span>
          </div>
          <div class="workflow-history" v-if="detail.workflow?.submitted_by"><span>提交：{{detail.workflow.submitted_by}}</span><span v-if="detail.workflow.reviewed_by">审批：{{detail.workflow.reviewed_by}} · {{detail.workflow.review_note||'无补充意见'}}</span></div>
          <div class="table-scroll"><table><thead><tr><th>商品</th><th class="numeric">数量</th><th class="numeric">单价</th><th class="numeric">金额</th></tr></thead><tbody><tr v-for="l in detail.lines"><td><strong>{{l.product_name}}</strong><small class="cell-sub mono">{{l.sku}}</small></td><td class="numeric">{{qty(l.quantity)}} {{l.unit}}</td><td class="numeric">¥{{money(l.unit_price)}}</td><td class="numeric">¥{{money(l.line_amount)}}</td></tr></tbody></table></div>
          <div class="detail-note"><span>备注</span><p>{{detail.note||'无'}}</p></div><div class="order-total"><span>单据合计</span><strong>¥{{money(detail.total_amount)}}</strong></div><div class="audit-line">创建时间：{{formatTimestamp(detail.created_at)}}<span v-if="detail.completed_at"> · 完成时间：{{formatTimestamp(detail.completed_at)}}</span></div>
        </div>
        <footer class="modal-footer">
          <div><button class="btn" @click="printDetail"><app-icon name="printer"></app-icon>打印</button><button class="btn danger-text" v-if="detail.status==='DRAFT'&&detail.workflow?.state!=='SUBMITTED'&&can('edit')" @click="confirmCancel(detail)"><app-icon name="ban"></app-icon>作废单据</button></div>
          <div><button class="btn" @click="closeModal">关闭</button>
            <button class="btn primary" v-if="detail.status==='DRAFT'&&(!detail.workflow||['DRAFT','REJECTED'].includes(detail.workflow.state))&&can('edit')" @click="confirmWorkflow(detail,'submit')"><app-icon name="send"></app-icon>提交审批</button>
            <template v-if="detail.status==='DRAFT'&&detail.workflow?.state==='SUBMITTED'&&can('review')"><button class="btn danger-text" @click="confirmWorkflow(detail,'reject')"><app-icon name="undo-2"></app-icon>驳回</button><button class="btn primary" @click="confirmWorkflow(detail,'approve')"><app-icon name="check"></app-icon>审批通过</button></template>
            <button class="btn primary" v-if="detail.status==='DRAFT'&&detail.workflow?.state==='APPROVED'&&can('post')" @click="confirmPost(detail)"><app-icon :name="detail.type==='PURCHASE'?'package-check':'truck'"></app-icon>{{detail.type==='PURCHASE'?'确认入库':'确认出库'}}</button>
          </div>
        </footer>
      </template>
      <template v-if="modal==='integration'"><div class="modal-body"><p class="integration-description">{{integration.name}}已完成接口契约设计。正式接入需要以下资料：</p><ul class="requirements"><li v-for="r in integration.requirements"><app-icon name="file-check-2"></app-icon>{{r}}</li></ul><div class="integration-note"><app-icon name="info"></app-icon>当前页面已保留请求、响应、回执和异常重试流程，配置正式服务参数后即可切换到外部系统。</div></div><footer class="modal-footer"><span></span><button class="btn primary" @click="closeModal">知道了</button></footer></template>
      <template v-if="modal==='messages'&&messageData"><div class="modal-body"><template v-if="messageData.kingdee"><div class="document-meta"><div><span>服务提供方</span><strong>金蝶云星空 OpenAPI</strong></div><div><span>接口模式</span><strong>{{messageData.kingdee.status.displayMode||'标准接口适配'}}</strong></div><div><span>账套</span><strong>{{messageData.kingdee.status.accountLabel}}</strong></div><div><span>鉴权结果</span><strong class="green">{{messageData.kingdee.login.success?'成功':'失败'}}</strong></div></div><h3>登录回执</h3><pre class="code-block message-code">{{pretty(messageData.kingdee.login)}}</pre><h3>采购订单 · PUR_PurchaseOrder</h3><pre class="code-block message-code">{{pretty(messageData.kingdee.purchaseOrders)}}</pre><h3>销售订单 · SAL_SaleOrder</h3><pre class="code-block message-code">{{pretty(messageData.kingdee.salesOrders)}}</pre><h3>库存单据 · STK_InStock</h3><pre class="code-block message-code">{{pretty(messageData.kingdee.inventoryDocuments)}}</pre></template><template v-else-if="messageData.job"><div class="document-meta"><div><span>目标通道</span><strong>{{messageData.job.target}}</strong></div><div><span>业务单据</span><strong>{{messageData.job.order_no}}</strong></div><div><span>状态</span><strong>{{jobLabel(messageData.job.status)}}</strong></div><div><span>请求次数</span><strong>{{messageData.job.attempts}}</strong></div></div><h3>请求报文</h3><pre class="code-block message-code">{{pretty(messageData.job.payload)}}</pre><h3>最近回执</h3><pre class="code-block message-code">{{pretty(messageData.job.response_text)}}</pre><h3>请求记录</h3><div class="attempt-item" v-for="a in messageData.attempts"><span :class="a.success?'green':'red'">{{a.success?'成功':'失败'}}</span><small>{{formatTimestamp(a.created_at)}}</small><pre>{{pretty(a.response_text)}}</pre></div></template><template v-else><h3>{{messageData.exchange.target}} · 请求报文</h3><pre class="code-block message-code">{{pretty(messageData.exchange.request_text)}}</pre><h3>响应报文</h3><pre class="code-block message-code">{{pretty(messageData.exchange.response_text)}}</pre></template></div><footer class="modal-footer"><span></span><button class="btn" @click="closeModal">关闭</button></footer></template>
      <form v-if="modal==='work'" @submit.prevent="saveWork"><div class="modal-body"><div class="document-meta"><div><span>生产工单</span><strong>{{workForm.orderNo}}</strong></div><div><span>产品</span><strong>{{workForm.productName}}</strong></div></div><div class="form-grid"><label>本次完成数量<input type="number" v-model.number="workForm.quantity" min="0.001" :max="workForm.max" step="0.001" required></label><label>剩余可报数量<input :value="qty(workForm.max)" disabled></label></div><p class="form-error" v-if="formError">{{formError}}</p></div><footer class="modal-footer"><span></span><div><button type="button" class="btn" @click="closeModal" :disabled="saving">取消</button><button class="btn primary" type="submit" :disabled="saving"><app-icon name="check"></app-icon>{{saving?'正在提交':'确认报工'}}</button></div></footer></form>
    </section>
  </div>
  <div class="confirm-backdrop" v-if="confirmation"><section class="confirm-dialog" role="alertdialog" aria-modal="true" :aria-label="confirmation.title" tabindex="-1" ref="confirmDialog"><span class="confirm-icon" :class="{warning:['cancel','reject'].includes(confirmation.kind)}"><app-icon :name="confirmation.kind==='cancel'?'ban':'clipboard-check'"></app-icon></span><h2>{{confirmation.title}}</h2><p>{{confirmation.message}}</p><label v-if="['approve','reject'].includes(confirmation.kind)" class="note-field">审批意见<textarea v-model="confirmation.note" maxlength="500" rows="3" :placeholder="confirmation.kind==='reject'?'请填写驳回原因':'选填'"></textarea></label><p class="form-error" v-if="confirmError">{{confirmError}}</p><div class="confirm-actions"><button class="btn" @click="confirmation=null" :disabled="saving">返回</button><button class="btn" :class="['cancel','reject'].includes(confirmation.kind)?'danger':'primary'" @click="executeConfirmation" :disabled="saving"><app-icon :name="saving?'loader-circle':'check'" :class="{spinning:saving}"></app-icon>{{saving?'处理中':confirmation.label}}</button></div></section></div>
  <div class="toast" v-if="toast" :class="toast.kind" role="status"><app-icon :name="toast.kind==='error'?'circle-alert':'circle-check'"></app-icon>{{toast.text}}<button class="icon-button" title="关闭通知" @click="toast=null"><app-icon name="x"></app-icon></button></div>
  <div class="initial-loading" v-if="loading&&!loaded"><span class="brand-symbol"><app-icon name="blocks"></app-icon></span><h2>ERP 管理系统</h2><p>正在读取业务账套…</p><app-icon name="loader-circle" class="spinning"></app-icon></div>
  </template>
</div>
</body>
</html>
