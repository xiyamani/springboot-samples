spring.application.name=erp-training
server.address=127.0.0.1
server.port=${ERP_PORT:8087}
spring.datasource.url=${ERP_DB_URL:jdbc:h2:file:./data/erp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${ERP_DB_USER:sa}
spring.datasource.password=${ERP_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:workflow-schema.sql
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=false
mybatis.configuration.map-underscore-to-camel-case=true
spring.web.resources.cache.period=0
server.error.include-message=never
logging.level.cn.training.erp=INFO
erp.workflow.required=true
erp.integrations.auto-dispatch=true
erp.integrations.base-url=${ERP_INTEGRATION_URL:}
erp.integrations.token=${ERP_INTEGRATION_TOKEN:training-local-token}
erp.kingdee.mode=${ERP_KINGDEE_MODE:MOCK}
erp.kingdee.base-url=${ERP_KINGDEE_BASE_URL:}
erp.kingdee.app-id=${ERP_KINGDEE_APP_ID:}
erp.kingdee.app-secret=${ERP_KINGDEE_APP_SECRET:}
erp.kingdee.acct-id=${ERP_KINGDEE_ACCT_ID:}
erp.kingdee.username=${ERP_KINGDEE_USERNAME:}
erp.kingdee.password=${ERP_KINGDEE_PASSWORD:}
erp.kingdee.lcid=${ERP_KINGDEE_LCID:2052}
erp.kingdee.demo-account-name=${ERP_KINGDEE_DEMO_ACCOUNT_NAME:\u91d1\u8776\u4e91\u661f\u8fb0\u4e1a\u52a1\u8d26\u5957}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
